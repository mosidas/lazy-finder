name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 4 リポジトリの既存 run の実測 1〜4 分の約 5 倍
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=タグの形式::タグは vX.Y.Z の形で付ける(例: v1.2.3): $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # write 権限の job でキャッシュを復元しない
          cache: false

      - name: Test
        run: make test

      - name: Build application
        run: make dist TAG="$GITHUB_REF_NAME"

      - name: Verify
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/lazy-finder-"$GITHUB_REF_NAME"-*.tar.gz)
          if [[ ${#files[@]} -ne 4 ]]; then
            echo "::error title=成果物の検証::tar.gz が 4 つでなく ${#files[@]} つある"
            exit 1
          fi
          dir=$(mktemp -d)
          tar -xzf "dist/lazy-finder-$GITHUB_REF_NAME-linux-amd64.tar.gz" -C "$dir"
          if ! "$dir/lazy-finder" -h; then
            echo "::error title=成果物の検証::linux-amd64 の lazy-finder -h が失敗した"
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/lazy-finder-${{ github.ref_name }}-*.tar.gz
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
